<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thực hành An toàn thông tin nâng cao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #343a40;
            padding: 40px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            background: #ffffffdd;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3), 0 6px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid #007bff;
            transition: box-shadow 0.3s ease;
        }
        .container:hover {
            box-shadow: 0 15px 30px rgba(0, 123, 255, 0.5), 0 10px 10px rgba(0, 0, 0, 0.15);
        }
        img {
            display: block;
            margin: 0 auto 30px auto;
            width: 40%;
            max-width: 180px;
            height: auto;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.15));
            border-radius: 10px;
        }
        h4 {
            font-weight: 800;
            margin-bottom: 40px;
            color: #0056b3;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        ul {
            padding-left: 0;
            list-style: none;
            margin-bottom: 30px;
        }
        ul li {
            margin-bottom: 20px;
        }
        ul li a {
            font-size: 1.3rem;
            color: #007bff;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px 25px;
            background: #e7f1ff;
            display: inline-block;
            box-shadow: inset 0 0 0 0 #007bff;
            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease;
        }
        ul li a:hover,
        ul li a:focus {
            color: #ffffff;
            background-color: #007bff;
            box-shadow: inset 200px 0 0 0 #0056b3;
            text-decoration: none;
        }
        .student-info {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #343a40;
            background: #e3f2fd;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        footer {
            margin-top: 35px;
            font-size: 0.9rem;
            color: #555d66;
            user-select: none;
        }
        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
            }
            ul li a {
                padding: 10px 20px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="HUTECH Logo" />
        <h4>BÀI THỰC HÀNH BẢO MẬT THÔNG TIN NÂNG CAO</h4>
        <ul>
            <li><a href="/caesar">Caesar Cipher</a></li>
            <li><a href="/vigenere">Vigenère Cipher</a></li>
            <li><a href="/railfence">Rail Fence Cipher</a></li>
            <li><a href="/playfair">Playfair Cipher</a></li>
        </ul>
        <div class="student-info">
            Lâm Nhật Khang - 2280601396 - HELLO WORLD
        </div>
        <footer>© 2025 HUTECH - Thực hành An toàn thông tin nâng cao</footer>
    </div>
</body>
</html>
